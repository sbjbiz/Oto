name: Build Oto for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3 (needed by the .exe installer)
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Version
        id: version
        shell: bash
        run: echo "value=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build installer and portable app
        run: .\gradlew.bat --stacktrace :desktopApp:packageExe :desktopApp:createDistributable "-Pbitchord.version=${{ steps.version.outputs.value }}"

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/Oto-setup-x64.exe"
          7z a -tzip -mx=5 "dist/Oto-portable-x64.zip" "desktopApp/build/compose/binaries/main/app/Oto/*" | Out-Null
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Oto-windows-x64
          path: dist/*

      - name: Publish as the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/* --title "Oto ${{ steps.version.outputs.value }}" \
            --notes "Built from ${{ github.sha }}. Download Oto-setup-x64.exe to install, or the portable zip to run without installing." \
            --latest
