name: Build Oto for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3 (needed by the .exe installer)
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Version
        id: version
        shell: bash
        run: echo "value=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build installer and portable app
        run: .\gradlew.bat --stacktrace :desktopApp:packageExe :desktopApp:createDistributable "-Poto.version=${{ steps.version.outputs.value }}"

      - name: Music video self-test
        env:
          OTO_NET_TEST: "1"
        run: .\gradlew.bat :desktopApp:test --tests "app.oto.desktop.MusicVideoSelfTest*" --tests "app.oto.desktop.VersionAlignerTest*" --tests "app.oto.desktop.PlaybackSafetyTest*" -i "-Poto.version=${{ steps.version.outputs.value }}"

      - name: Size report
        shell: bash
        run: |
          cd desktopApp/build/compose/binaries/main/app/Oto
          du -sh . || true
          ls -S -l app | head -15 || true

      - name: Smoke test (app starts and stays up)
        shell: pwsh
        run: |
          $exe = "desktopApp/build/compose/binaries/main/app/Oto/Oto.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 45
          $failed = $p.HasExited
          if ($failed) { Write-Host "Oto exited early with code $($p.ExitCode)" } else { Write-Host "Oto is still running"; Stop-Process -Id $p.Id -Force }
          $log = Join-Path $env:LOCALAPPDATA "Oto\oto.log"
          if (Test-Path $log) {
            Get-Content $log -Tail 80
            $bad = Select-String -Path $log -Pattern "UnsatisfiedLinkError|NoClassDefFoundError|NoSuchMethodError|native Windows frame unavailable"
            if ($bad) { Write-Host "Problems in the log:"; $bad | % { $_.Line }; $failed = $true }
          } else { Write-Host "no log at $log" }
          if ($failed) { exit 1 }

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/Oto-setup-x64.exe"
          7z a -tzip -mx=5 "dist/Oto-portable-x64.zip" "desktopApp/build/compose/binaries/main/app/Oto/*" | Out-Null
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Oto-windows-x64
          path: dist/*

      - name: Publish as release v1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1 dist/* --title "Oto v1" \
            --notes "Download Oto-setup-x64.exe to install, or Oto-portable-x64.zip to run without installing. Build ${{ steps.version.outputs.value }}." \
            --latest
